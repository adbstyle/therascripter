<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">Platzhalter: Sprachmodell-Auswahl in den Einstellungen</title>
  <rect width="1200" height="800" fill="#f5f5f4" />
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" />
    <rect width="1080" height="48" rx="14" fill="#fafaf9" />
    <rect y="34" width="1080" height="14" fill="#fafaf9" />
    <circle cx="24" cy="24" r="7" fill="#ef4444" />
    <circle cx="48" cy="24" r="7" fill="#f59e0b" />
    <circle cx="72" cy="24" r="7" fill="#10b981" />
    <text x="540" y="29" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#78716c">Therascript – Einstellungen · Modelle</text>
    <g transform="translate(40,80)" font-family="-apple-system,system-ui,sans-serif">
      <text font-size="22" fill="#171717" font-weight="600">Sprachmodelle</text>
      <text y="30" font-size="14" fill="#78716c">Wählen Sie das aktive Modell. Mehrere können installiert sein.</text>
    </g>
    <g transform="translate(40,150)" font-family="-apple-system,system-ui,sans-serif">
      <rect width="1000" height="100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" />
      <circle cx="36" cy="50" r="10" fill="#0f766e" />
      <circle cx="36" cy="50" r="4" fill="#fff" />
      <text x="64" y="36" font-size="16" fill="#171717" font-weight="600">Whisper Large V3 Turbo (Q5_0)</text>
      <text x="64" y="58" font-size="13" fill="#78716c">Standard · multilingual · 1.7 GB · installiert</text>
      <rect x="850" y="32" width="120" height="32" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5" />
      <text x="910" y="52" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="500">Aktiv</text>
    </g>
    <g transform="translate(40,270)" font-family="-apple-system,system-ui,sans-serif">
      <rect width="1000" height="100" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" />
      <circle cx="36" cy="50" r="10" fill="none" stroke="#a8a29e" stroke-width="2" />
      <text x="64" y="36" font-size="16" fill="#171717" font-weight="600">Schweizerdeutsch Fine-Tune</text>
      <text x="64" y="58" font-size="13" fill="#78716c">Optional · de-CH · 1.9 GB · installiert</text>
      <rect x="850" y="32" width="120" height="32" rx="8" fill="#0f766e" />
      <text x="910" y="52" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Aktivieren</text>
    </g>
    <g transform="translate(40,390)" font-family="-apple-system,system-ui,sans-serif">
      <rect width="1000" height="100" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" />
      <circle cx="36" cy="50" r="10" fill="none" stroke="#a8a29e" stroke-width="2" />
      <text x="64" y="36" font-size="16" fill="#171717" font-weight="600">Gemma 3 4B Instruct (Q4_K_M)</text>
      <text x="64" y="58" font-size="13" fill="#78716c">Optional · Zusammenfassung · 2.5 GB · nicht installiert</text>
      <rect x="850" y="32" width="120" height="32" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5" />
      <text x="910" y="52" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="500">Laden</text>
    </g>
    <text x="540" y="640" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#a8a29e">Platzhalter – wird durch echten Screenshot ersetzt</text>
  </g>
