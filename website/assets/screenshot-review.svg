<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">Platzhalter: Review-Editor mit pseudonymisierten Begriffen als Chips</title>
  <rect width="1200" height="800" fill="#f5f5f4" />
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" />
    <rect width="1080" height="48" rx="14" fill="#fafaf9" />
    <rect y="34" width="1080" height="14" fill="#fafaf9" />
    <circle cx="24" cy="24" r="7" fill="#ef4444" />
    <circle cx="48" cy="24" r="7" fill="#f59e0b" />
    <circle cx="72" cy="24" r="7" fill="#10b981" />
    <text x="540" y="29" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#78716c">Therascript – Review</text>
    <g transform="translate(60,90)" font-family="-apple-system,system-ui,sans-serif">
      <text font-size="18" fill="#171717" font-weight="600">Sitzung vom 4. Mai 2026 · 14:30 Uhr</text>
      <g transform="translate(0,40)">
        <text font-size="14" fill="#171717">Heute kam</text>
        <g transform="translate(85,-18)">
          <rect width="120" height="26" rx="13" fill="#d6ecf5" />
          <text x="14" y="17" font-size="13" fill="#1884b5" font-weight="500">[PERSON 1]</text>
        </g>
        <text x="215" font-size="14" fill="#171717">in die Praxis. Sie berichtete von ihrer Reise nach</text>
      </g>
      <g transform="translate(0,76)">
        <g transform="translate(0,-18)">
          <rect width="100" height="26" rx="13" fill="#d6ecf5" />
          <text x="14" y="17" font-size="13" fill="#1884b5" font-weight="500">[ORT 1]</text>
        </g>
        <text x="110" font-size="14" fill="#171717">und sprach offen über die anhaltende</text>
        <g transform="translate(370,-18)">
          <rect width="150" height="26" rx="13" fill="#d6ecf5" />
          <text x="14" y="17" font-size="13" fill="#1884b5" font-weight="500">[DIAGNOSE 1]</text>
        </g>
      </g>
      <g transform="translate(0,116)">
        <text font-size="14" fill="#171717">und die damit verbundene Erschöpfung.</text>
      </g>
      <text y="180" font-size="14" fill="#171717">Wir besprachen Strategien für besseren Schlaf und Pausen-</text>
      <text y="204" font-size="14" fill="#171717">gestaltung. Nächster Termin: 11. Mai.</text>
      <g transform="translate(0,260)">
        <rect width="600" height="40" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" />
        <text x="20" y="26" font-size="14" fill="#92400e">Tipp: Per Klick auf einen Chip lässt sich der Begriff anpassen.</text>
      </g>
    </g>
    <text x="540" y="640" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#a8a29e">Platzhalter – wird durch echten Screenshot ersetzt</text>
  </g>
</svg>
