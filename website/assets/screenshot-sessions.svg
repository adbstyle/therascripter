<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">Platzhalter: Sessions-Übersicht mit chronologischer Sortierung</title>
  <rect width="1200" height="800" fill="#f5f5f4" />
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" />
    <rect width="1080" height="48" rx="14" fill="#fafaf9" />
    <rect y="34" width="1080" height="14" fill="#fafaf9" />
    <circle cx="24" cy="24" r="7" fill="#ef4444" />
    <circle cx="48" cy="24" r="7" fill="#f59e0b" />
    <circle cx="72" cy="24" r="7" fill="#10b981" />
    <text x="540" y="29" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#78716c">Therascript – Transkriptionen</text>
    <g transform="translate(40,80)" font-family="-apple-system,system-ui,sans-serif">
      <text font-size="22" fill="#171717" font-weight="600">Transkriptionen</text>
      <text x="280" y="-2" font-size="13" fill="#78716c">12 Sitzungen · 8 in Bearbeitung</text>
    </g>
    <g transform="translate(40,140)" font-family="-apple-system,system-ui,sans-serif">
      <g>
        <rect width="1000" height="80" rx="10" fill="#fafaf9" />
        <text x="20" y="32" font-size="15" fill="#171717" font-weight="500">Sitzung 04.05.2026 · 14:30</text>
        <text x="20" y="56" font-size="13" fill="#78716c">42 Min · bereit zur Überprüfung</text>
        <rect x="880" y="22" width="100" height="36" rx="8" fill="#1884b5" />
        <text x="930" y="46" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Öffnen</text>
      </g>
      <g transform="translate(0,100)">
        <rect width="1000" height="80" rx="10" fill="#fafaf9" />
        <text x="20" y="32" font-size="15" fill="#171717" font-weight="500">Sitzung 02.05.2026 · 09:00</text>
        <text x="20" y="56" font-size="13" fill="#78716c">38 Min · Verarbeitung läuft</text>
        <circle cx="930" cy="40" r="14" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="40 20" transform="rotate(0 930 40)" />
      </g>
      <g transform="translate(0,200)">
        <rect width="1000" height="80" rx="10" fill="#fafaf9" />
        <text x="20" y="32" font-size="15" fill="#171717" font-weight="500">Sitzung 28.04.2026 · 16:15</text>
        <text x="20" y="56" font-size="13" fill="#78716c">35 Min · überprüft · wird in 26 Tagen gelöscht</text>
        <text x="930" y="46" text-anchor="middle" font-size="13" fill="#78716c">…</text>
      </g>
      <g transform="translate(0,300)">
        <rect width="1000" height="80" rx="10" fill="#fafaf9" />
        <text x="20" y="32" font-size="15" fill="#171717" font-weight="500">Sitzung 21.04.2026 · 11:00</text>
        <text x="20" y="56" font-size="13" fill="#78716c">52 Min · überprüft · wird in 19 Tagen gelöscht</text>
        <text x="930" y="46" text-anchor="middle" font-size="13" fill="#78716c">…</text>
      </g>
    </g>
    <text x="540" y="640" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#a8a29e">Platzhalter – wird durch echten Screenshot ersetzt</text>
  </g>
