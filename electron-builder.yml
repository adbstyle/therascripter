appId: com.therascript.app
productName: Therascript
directories:
  buildResources: build
  output: dist
# Whitelist statt Blacklist: NUR der electron-vite-Output und package.json
# gehören ins app.asar (Production-node_modules sammelt electron-builder
# separat über den Dependency-Graph ein). Die frühere Blacklist hat u. a.
# swift_cli/.build (271 MB Build-Cache), website/, .claude/ und die .env
# (R2-Credentials!) ins ausgelieferte Archiv geleakt.
files:
  - out/**/*
  - package.json
  # Optionale pdfjs-dist-Dep für Node-Canvas-Rendering (25 MB nativ) — wir
  # nutzen nur getTextContent(), nie Rasterung.
  - '!node_modules/@napi-rs/**'
extraResources:
  # whisper.cpp and llama.cpp link against incompatible ggml generations, so
  # each toolchain ships as its own self-contained bundle. Each binary's
  # LC_RPATH=@loader_path/../lib resolves to its tool-specific lib/ sibling.
  # See docs/plans/ggml-abi-split.md.
  - from: resources/whisper
    to: whisper
    filter:
      - '**/*'
  - from: resources/llama
    to: llama
    filter:
      - '**/*'
  - from: resources/bin/ffmpeg
    to: bin/ffmpeg
  - from: resources/bin/vision-ocr
    to: bin/vision-ocr
  - from: resources/icons
    to: icons
    filter:
      - '**/*.png'
  - from: python_sidecar/standalone
    to: ml_sidecar/standalone
    filter:
      - '**/*'
  - from: python_sidecar/diarize.py
    to: ml_sidecar/diarize.py
  - from: python_sidecar/ner_service.py
    to: ml_sidecar/ner_service.py
  - from: python_sidecar/torchcodec_shim.py
    to: ml_sidecar/torchcodec_shim.py
npmRebuild: false
afterPack: build-scripts/afterPack.js
afterAllArtifactBuild: build-scripts/finalize-dmg.js
mac:
  target:
    - target: dmg
      arch: arm64
  artifactName: ${productName}.dmg
  category: public.app-category.medical
  identity: null
dmg:
  background: build/dmg-background.png
  iconSize: 110
  iconTextSize: 12
  window:
    width: 540
    height: 440
  title: ${productName} ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
