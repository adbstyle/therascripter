appId: com.therascript.app
productName: Therascript
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.*'
  - '!{.eslintrc,.eslintignore,.prettierrc,.prettierignore,eslint.config.*}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{vitest.config.*}'
  - '!{*.md,LICENSE}'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  - from: resources/lib
    to: lib
    filter:
      - '**/*'
  - from: python_sidecar/dist/ml_sidecar
    to: ml_sidecar
    filter:
      - '**/*'
afterPack: build-scripts/afterPack.js
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.medical
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
